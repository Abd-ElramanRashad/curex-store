<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المتجر الإلكتروني</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; padding: 0; background-color: #f9f9f9; text-align: center; }
    h1 { color: #333; }
    .products-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 20px; }
    .product-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; width: 220px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .product-card img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
    .product-title { font-weight: bold; margin: 10px 0 5px; }
    .product-price { color: #27ae60; font-size: 1.1em; }
    #loading { font-size: 1.2em; color: #666; margin-top: 30px; }
  </style>
</head>
<body>

  <h1>المنتجات المتاحة</h1>
  <div id="loading">جاري تحميل المنتجات...</div>
  <div id="products-list" class="products-container"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaEFNQy72e95ikEhqWaYsWIZb-eQstLMdKeH0j3E9edL5uRXGmzlXxsIa_0nPESW_6/exec";

    async function fetchProducts() {
      const loading = document.getElementById('loading');
      const container = document.getElementById('products-list');

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getProducts`);
        const data = await response.json();

        loading.style.display = 'none';

        if (data.status === "success" && data.products && data.products.length > 0) {
          container.innerHTML = data.products.map(product => `
            <div class="product-card">
              <img src="${product.Image || product.image || 'https://via.placeholder.com/150'}" alt="${product.Name || product.title || 'منتج'}">
              <div class="product-title">${product.Name || product.title || 'بدون عنوان'}</div>
              <div class="product-price">${product.Price || product.price || '0'} جنيه</div>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p>لا توجد منتجات معروضة حالياً.</p>';
        }
      } catch (err) {
        loading.innerText = "حدث خطأ أثناء تحميل البيانات. يرجى المحاولة لاحقاً.";
        console.error(err);
      }
    }

    fetchProducts();
  </script>

</body>
</html>
