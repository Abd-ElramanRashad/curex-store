<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر CureX</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-notes-medical"></i> متجر CureX
            </h1>
            <button onclick="toggleCart()" class="relative bg-indigo-800 hover:bg-indigo-900 px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition">
                <i class="fa-solid fa-cart-shopping"></i> السلة
                <span id="cart-count" class="bg-emerald-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-slate-700">المنتجات المتاحة</h2>
            <button onclick="fetchProducts()" class="text-sm text-indigo-600 hover:underline flex items-center gap-1">
                <i class="fa-solid fa-rotate-right"></i> تحديث المنتجات
            </button>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i>
            <p class="mt-2 text-slate-500">جاري تحميل المنتجات من قاعدة البيانات...</p>
        </div>

        <!-- Products Grid -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden"></div>
    </main>

    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 flex justify-end hidden">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-4 bg-indigo-700 text-white flex justify-between items-center">
                <h3 class="text-lg font-bold">سلة الشراء</h3>
                <button onclick="toggleCart()" class="text-white hover:text-slate-200 text-xl">&times;</button>
            </div>
            
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

            <div class="p-4 border-t bg-slate-50 space-y-4">
                <div class="flex justify-between items-center font-bold text-lg">
                    <span>الإجمالي:</span>
                    <span id="cart-total" class="text-emerald-600">0 ج.م</span>
                </div>

                <form id="checkout-form" onsubmit="handleCheckout(event)" class="space-y-3">
                    <input type="text" id="client-name" required placeholder="الاسم بالكامل" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    <input type="tel" id="client-phone" required placeholder="رقم الهاتف" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    <textarea id="client-address" required placeholder="العنوان بالتفصيل" rows="2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm"></textarea>
                    
                    <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-bold transition flex justify-center items-center gap-2">
                        <span>تأكيد الطلب</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // ضع رابط الـ Web App الناتج عن عملية النشر الجديدة هنا
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_HpfGElmBVob0743czZ5vCgHWZvYGriOzMmOpa23WPRkrULkxFTE6zf7piVmsg/exec";

        let products = [];
        let cart = [];

        // جلب المنتجات
        async function fetchProducts() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('products-grid').classList.add('hidden');
            
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getProducts`);
                products = await response.json();
                renderProducts();
            } catch (error) {
                alert('حدث خطأ أثناء تحميل المنتجات!');
                console.error(error);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('products-grid').classList.remove('hidden');
            }
        }

        // عرض المنتجات
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            if (!products || products.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-8">لا توجد منتجات مسجلة حالياً في الشيت.</p>`;
                return;
            }

            grid.innerHTML = products.map(product => `
                <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition flex flex-col justify-between">
                    <div class="p-4">
                        <span class="text-xs font-semibold bg-indigo-50 text-indigo-600 px-2 py-1 rounded-full">${product.category || 'عام'}</span>
                        <h3 class="font-bold text-lg mt-2 text-slate-800">${product.item_name}</h3>
                        <p class="text-xs text-slate-400 mt-1">كود: ${product.item_code}</p>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="text-xl font-bold text-emerald-600">${product.selling_price} ج.م</span>
                            <span class="text-xs ${product.current_stock > 0 ? 'text-slate-500' : 'text-red-500 font-bold'}">
                                ${product.current_stock > 0 ? `المتاح: ${product.current_stock}` : 'نفذت الكمية'}
                            </span>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <button onclick="addToCart('${product.item_code}')" 
                                ${product.current_stock <= 0 ? 'disabled' : ''} 
                                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white py-2 rounded-lg font-semibold transition text-sm">
                            ${product.current_stock > 0 ? 'إضافة للسلة' : 'غير متوفر'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // إضافة للسلة
        function addToCart(itemCode) {
            const product = products.find(p => p.item_code === itemCode);
            const cartItem = cart.find(item => item.item_code === itemCode);

            if (cartItem) {
                if (cartItem.qty < product.current_stock) {
                    cartItem.qty++;
                } else {
                    alert('عذراً، لقد وصلت للحد الأقصى للمخزون المتاح!');
                }
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
        }

        // تحديث واجهة السلة
        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            
            const cartItemsContainer = document.getElementById('cart-items');
            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="flex justify-between items-center border-b pb-3">
                    <div>
                        <h4 class="font-bold text-sm text-slate-800">${item.item_name}</h4>
                        <p class="text-xs text-slate-500">${item.selling_price} ج.م</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty('${item.item_code}', -1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded text-sm font-bold">-</button>
                        <span class="text-sm font-bold">${item.qty}</span>
                        <button onclick="changeQty('${item.item_code}', 1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded text-sm font-bold">+</button>
                    </div>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.selling_price * item.qty), 0);
            document.getElementById('cart-total').innerText = `${total} ج.م`;
        }

        function changeQty(itemCode, change) {
            const item = cart.find(i => i.item_code === itemCode);
            const product = products.find(p => p.item_code === itemCode);

            if (item) {
                item.qty += change;
                if (item.qty > product.current_stock) {
                    item.qty = product.current_stock;
                    alert('وصلت للحد الأقصى للمخزون!');
                }
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.item_code !== itemCode);
                }
            }
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        // إرسال الطلب
        async function handleCheckout(e) {
            e.preventDefault();
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري الإرسال...`;

            try {
                for (const item of cart) {
                    const orderPayload = {
                        action: "createOrder",
                        order: {
                            client_name: document.getElementById('client-name').value,
                            client_phone: document.getElementById('client-phone').value,
                            client_address: document.getElementById('client-address').value,
                            item_code: item.item_code,
                            item_name: item.item_name,
                            qty: item.qty,
                            total_price: item.selling_price * item.qty
                        }
                    };

                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(orderPayload)
                    });
                }

                alert('تم تسجيل طلبك بنجاح! شكراً لك.');
                cart = [];
                updateCartUI();
                toggleCart();
                document.getElementById('checkout-form').reset();
                fetchProducts();
            } catch (error) {
                alert('حدث خطأ أثناء إرسال الطلب!');
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>تأكيد الطلب</span>`;
            }
        }

        // التحميل الأولي
        fetchProducts();
    </script>
</body>
</html>
