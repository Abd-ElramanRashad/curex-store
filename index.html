<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CureX - المتجر الإلكتروني</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; color: #333; }
        header { text-align: center; margin-bottom: 30px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card h3 { margin-top: 0; color: #007bff; }
        .price { font-size: 1.2em; font-weight: bold; color: #28a745; margin: 10px 0; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 1em; width: 100%; }
        button:hover { background: #0056b3; }
        /* Modal Style */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        .actions { display: flex; gap: 10px; }
        .btn-cancel { background: #dc3545; }
    </style>
</head>
<body>

<header>
    <h1>متجر CureX للوازم المطبخ والأدوات</h1>
    <p>اختر المنتجات واطلب الآن مباشرة!</p>
</header>

<div class="products-grid" id="productsContainer">
    <p>جاري تحميل المنتجات...</p>
</div>

<!-- Modal للشراء -->
<div class="modal" id="orderModal">
    <div class="modal-content">
        <h3>تأكيد الطلب</h3>
        <form id="orderForm">
            <input type="hidden" id="selectedItemCode">
            <input type="hidden" id="selectedItemName">
            <input type="hidden" id="selectedSellingPrice">

            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="displayItemName" readonly>
            </div>
            <div class="form-group">
                <label>اسمك الكامل:</label>
                <input type="text" id="clientName" required>
            </div>
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="tel" id="clientPhone" required>
            </div>
            <div class="form-group">
                <label>العنوان:</label>
                <input type="text" id="clientAddress" required>
            </div>
            <div class="form-group">
                <label>الكمية:</label>
                <input type="number" id="orderQty" value="1" min="1" required onchange="calculateTotal()">
            </div>
            <div class="form-group">
                <label>الإجمالي (ج.م):</label>
                <input type="text" id="totalAmount" readonly>
            </div>
            <div class="actions">
                <button type="submit">إرسال الطلب</button>
                <button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button>
            </div>
        </form>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYSl7r4_pGgzt3OMmanYGrSQ3KF4vOmwMwlGyBNLnOYyKh0hGhq3SHlhIf9Yd1SFOb/exec";

    // جلب المنتجات عند تحميل الصفحة
    window.onload = function() {
        fetch(`${SCRIPT_URL}?action=getProducts`)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('productsContainer');
                container.innerHTML = '';
                if (data.success && data.products.length > 0) {
                    data.products.forEach(p => {
                        container.innerHTML += `
                            <div class="product-card">
                                <h3>${p.itemName}</h3>
                                <p>الفئة: ${p.category}</p>
                                <div class="price">${p.sellingPrice} ج.م</div>
                                <button onclick="openModal('${p.itemCode}', '${p.itemName}', ${p.sellingPrice})">شراء الآن</button>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p>لا توجد منتجات متاحة حالياً.</p>';
                }
            })
            .catch(err => {
                document.getElementById('productsContainer').innerHTML = '<p>حدث خطأ أثناء تحميل البيانات.</p>';
            });
    };

    function openModal(code, name, price) {
        document.getElementById('selectedItemCode').value = code;
        document.getElementById('selectedItemName').value = name;
        document.getElementById('displayItemName').value = name;
        document.getElementById('selectedSellingPrice').value = price;
        document.getElementById('orderQty').value = 1;
        calculateTotal();
        document.getElementById('orderModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('orderModal').style.display = 'none';
    }

    function calculateTotal() {
        const qty = parseInt(document.getElementById('orderQty').value) || 1;
        const price = parseFloat(document.getElementById('selectedSellingPrice').value) || 0;
        document.getElementById('totalAmount').value = qty * price;
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const payload = {
            action: 'createOrder',
            itemCode: document.getElementById('selectedItemCode').value,
            itemName: document.getElementById('selectedItemName').value,
            clientName: document.getElementById('clientName').value,
            phone: document.getElementById('clientPhone').value,
            address: document.getElementById('clientAddress').value,
            quantity: parseInt(document.getElementById('orderQty').value),
            totalAmount: parseFloat(document.getElementById('totalAmount').value)
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert('تم تسجيل طلبك بنجاح! شكرًا لاستخدامك CureX');
                closeModal();
            } else {
                alert('حدث خطأ: ' + data.message);
            }
        })
        .catch(err => alert('حدث خطأ في الاتصال بالحادم.'));
    });
</script>

</body>
</html>
