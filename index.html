<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج إرسال البيانات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #218838;
        }
        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h2>تسجيل البيانات</h2>
    <form id="dataForm">
        <div class="form-group">
            <label for="name">الاسم:</label>
            <input type="text" id="name" name="name" required placeholder="أدخل اسمك">
        </div>
        
        <div class="form-group">
            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" name="email" required placeholder="example@domain.com">
        </div>

        <button type="submit" id="submitBtn">إرسال البيانات</button>
    </form>
    
    <div id="statusMessage"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxqYbRxOcPAgFncmpvegghSdNqcvzA-V7eSP8zZgNl_ITF9SKLEFOWxgIZW039mIXD7/exec';
    const form = document.getElementById('dataForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerText = 'جاري الإرسال...';
        statusMessage.innerText = '';
        statusMessage.className = '';

        const formData = new FormData(form);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(response => {
                statusMessage.innerText = 'تم إرسال البيانات بنجاح!';
                statusMessage.className = 'success';
                form.reset();
            })
            .catch(error => {
                statusMessage.innerText = 'حدث خطأ أثناء الإرسال، حاول مرة أخرى.';
                statusMessage.className = 'error';
                console.error('Error!', error.message);
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'إرسال البيانات';
            });
    });
</script>

</body>
</html>
