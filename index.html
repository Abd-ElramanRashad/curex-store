<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CureX Healthcare Solutions | متجر المستلزمات الطبية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة قراءة ملفات أكسيل SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        curex: {
                            teal: '#0D9488',
                            darkTeal: '#0F766E',
                            coral: '#F97316',
                            bgLight: '#FDFBF7'
                        }
                    },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style> body { font-family: 'Tajawal', sans-serif; background-color: #FDFBF7; } </style>
</head>
<body class="text-slate-800 relative min-h-screen pb-16">

    <!-- Header -->
    <div class="bg-curex-darkTeal text-white text-center py-2 px-4 text-xs md:text-sm font-medium flex justify-between items-center max-w-7xl mx-auto">
        <span>CureX Healthcare Solutions – قاعدة بيانات الأكسيل المباشرة</span>
        <a href="tel:01068260189" class="bg-curex-coral hover:bg-orange-600 text-white px-3 py-1 rounded-lg font-bold text-xs transition">
            📞 التواصل والإدارة: 01068260189
        </a>
    </div>

    <header class="bg-white/80 backdrop-blur-md border-b border-stone-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-12 h-12 bg-curex-teal text-white font-extrabold text-2xl rounded-2xl flex items-center justify-center">CX</div>
                <div>
                    <h1 class="font-black text-2xl text-curex-darkTeal leading-none">CureX</h1>
                    <span class="text-[10px] uppercase font-bold text-slate-400 block mt-0.5">Database Connected</span>
                </div>
            </div>

            <a href="admin.html" class="bg-curex-coral text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md">لوحة التحكم والأكسيل 📊</a>
        </div>
    </header>

    <!-- Main Section -->
    <section class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b pb-6">
            <div class="w-full md:w-1/3">
                <input type="text" id="search-input" onkeyup="renderProducts()" placeholder="🔍 ابحث في داتا أكسيل CureX..." class="w-full border rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-curex-teal">
            </div>

            <div class="flex bg-stone-200 p-1.5 rounded-2xl space-x-2 space-x-reverse">
                <button onclick="switchTab('all')" id="tab-all" class="px-4 py-2 rounded-xl text-xs md:text-sm font-bold bg-curex-teal text-white">الكل</button>
                <button onclick="switchTab('devices')" id="tab-devices" class="px-4 py-2 rounded-xl text-xs md:text-sm font-bold text-slate-700">أجهزة طبية 🩺</button>
                <button onclick="switchTab('consumables')" id="tab-consumables" class="px-4 py-2 rounded-xl text-xs md:text-sm font-bold text-slate-700">مستلزمات استهلاكية 📦</button>
            </div>
        </div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-12 text-slate-400 font-bold">جاري تحميل داتا أكسيل CureX_Cloud_Database...</div>
        </div>
    </section>

    <!-- Modal الشراء والخصم -->
    <div id="checkout-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border">
            <h3 class="text-2xl font-black text-curex-teal mb-2">تأكيد خصم الشراء من الشيت</h3>
            <form id="checkout-form" onsubmit="processOrder(event)">
                <input type="hidden" id="selected-product-id">
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">الكمية المطلوبة</label>
                        <input type="number" id="cust-qty" value="1" min="1" required class="w-full border rounded-xl p-2.5 text-sm">
                    </div>
                </div>

                <div class="flex space-x-3 space-x-reverse mt-6">
                    <button type="submit" class="flex-1 bg-curex-teal text-white font-extrabold py-3 rounded-xl text-sm">تأكيد الخصم</button>
                    <button type="button" onclick="closeCheckout()" class="px-5 py-3 bg-stone-100 font-bold rounded-xl text-sm">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
       const EXCEL_FILE_NAME = '_CureX_Cloud_Database.xlsx';
        let productsData = [];
        let currentCategory = 'all';

        // 1. القراءة من ذاكرة المتصفح أولاً أو جلب ملف الأكسيل الخارجي مباشرة
        window.addEventListener('DOMContentLoaded', () => {
            const localData = localStorage.getItem('curex_excel_data');
            if (localData) {
                productsData = JSON.parse(localData);
                renderProducts();
            } else {
                fetchExcelFile();
            }
        });

        // 2. قراءة ملف الأكسيل CureX_Cloud_Database
        function fetchExcelFile() {
            fetch(EXCEL_FILE_NAME)
                .then(res => {
                    if (!res.ok) throw new Error("لم يتم العثور على ملف الأكسيل");
                    return res.arrayBuffer();
                })
                .then(buffer => {
                    const workbook = XLSX.read(buffer, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    // تحويل بيانات الشيت لتناسب الموقع
                    productsData = jsonData.map((row, idx) => ({
                        id: row.ID || row.id || (idx + 1),
                        name: row.Name || row.name || row['اسم المنتج'] || 'منتج طبي',
                        category: (row.Category || row.category || row['التصنيف'] || '').toString().toLowerCase().includes('device') ? 'devices' : 'consumables',
                        price: parseFloat(row.Price || row.price || row['السعر'] || 0),
                        stock: parseInt(row.Stock || row.stock || row['المخزون'] || 0),
                        minStock: parseInt(row.MinStock || row.minStock || 5),
                        sold: parseInt(row.Sold || row.sold || 0),
                        description: row.Description || row.description || row['الوصف'] || 'مستلزمات طبية معتمدة'
                    }));

                    saveData();
                    renderProducts();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('products-grid').innerHTML = `
                        <div class="col-span-full text-center py-12 text-red-500 font-bold">
                            ⚠️ لم يتم العثور على ملف Excel باسم (${EXCEL_FILE_NAME}). يمكنك رفعه يدوياً من لوحة التحكم.
                        </div>`;
                });
        }

        function saveData() {
            localStorage.setItem('curex_excel_data', JSON.stringify(productsData));
        }

        function switchTab(cat) {
            currentCategory = cat;
            document.querySelectorAll('[id^="tab-"]').forEach(btn => btn.className = 'px-4 py-2 rounded-xl text-xs md:text-sm font-bold text-slate-700');
            document.getElementById(`tab-${cat}`).className = 'px-4 py-2 rounded-xl text-xs md:text-sm font-bold bg-curex-teal text-white';
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const searchVal = document.getElementById('search-input').value.toLowerCase();

            const filtered = productsData.filter(p => {
                const matchesCat = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-bold">لا توجد منتجات مطابقة لطلبك.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-3xl p-5 border shadow-sm flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-black px-2.5 py-1 rounded-full ${item.category === 'devices' ? 'bg-teal-50 text-curex-teal' : 'bg-orange-50 text-curex-coral'}">
                                ${item.category === 'devices' ? '🩺 جهاز طبي' : '📦 مستلزم'}
                            </span>
                            <span class="text-xs font-bold ${item.stock <= item.minStock ? 'text-red-600 font-black' : 'text-slate-400'}">
                                المتبقي: ${item.stock}
                            </span>
                        </div>
                        <h3 class="font-extrabold text-base text-slate-900 mb-1 leading-snug">${item.name}</h3>
                        <p class="text-slate-500 text-xs mb-3 line-clamp-2">${item.description}</p>
                    </div>

                    <div class="pt-3 border-t flex items-center justify-between">
                        <div>
                            <span class="text-[10px] text-slate-400 block font-bold">السعر</span>
                            <span class="font-black text-xl text-curex-coral">${item.price} <span class="text-xs font-bold">ج.م</span></span>
                        </div>
                        <button onclick="openCheckout(${item.id})" ${item.stock === 0 ? 'disabled' : ''} class="${item.stock === 0 ? 'bg-slate-300' : 'bg-curex-teal hover:bg-curex-darkTeal'} text-white font-extrabold px-3 py-2 rounded-xl text-xs transition">
                            ${item.stock === 0 ? 'نفذت' : 'خصم / شراء'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openCheckout(id) {
            document.getElementById('selected-product-id').value = id;
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        function processOrder(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('selected-product-id').value);
            const qty = parseInt(document.getElementById('cust-qty').value);
            
            const index = productsData.findIndex(p => p.id == id);
            if (index !== -1) {
                if (productsData[index].stock < qty) {
                    alert('عذراً، الكمية غير متوفرة!');
                    return;
                }
                productsData[index].stock -= qty;
                productsData[index].sold = (productsData[index].sold || 0) + qty;
                saveData();
                alert(`تم الخصم بنجاح! المتبقي الان: ${productsData[index].stock}`);
                closeCheckout();
                renderProducts();
            }
        }
    </script>
</body>
</html>
