<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CureX - متجر المستلزمات الطبية</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; }
    .navbar { background-color: #0d6efd; }
    .card-product { border: none; border-radius: 12px; transition: transform 0.2s; }
    .card-product:hover { transform: translateY(-5px); }
    .badge-stock { position: absolute; top: 10px; left: 10px; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">CureX Medical</a>
      <a href="admin.html" class="btn btn-outline-light btn-sm">لوحة التحكم</a>
    </div>
  </nav>

  <div class="container my-5">
    <div class="text-center mb-5">
      <h2 class="fw-bold text-primary">المستلزمات الطبية المتاحة</h2>
      <p class="text-muted">تصفح المنتجات وقم بتقديم طلبك مباشرة</p>
    </div>

    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">جاري تحميل المنتجات...</p>
    </div>

    <div class="row g-4" id="products-container"></div>
  </div>

  <!-- Modal الطلب -->
  <div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">تقديم طلب شراء</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="orderForm">
            <input type="hidden" id="orderItemCode">
            <input type="hidden" id="orderItemName">
            <input type="hidden" id="orderUnitPrice">

            <div class="mb-3">
              <label class="form-label">المنتج:</label>
              <input type="text" class="form-control" id="displayItemName" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">الكمية:</label>
              <input type="number" class="form-control" id="orderQuantity" value="1" min="1" required>
            </div>
            <div class="mb-3">
              <label class="form-label">الإجمالي (جنيه):</label>
              <input type="text" class="form-control" id="orderTotal" readonly>
            </div>
            <hr>
            <div class="mb-3">
              <label class="form-label">الاسم الكامل:</label>
              <input type="text" class="form-control" id="clientName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">رقم الهاتف:</label>
              <input type="tel" class="form-control" id="clientPhone" required>
            </div>
            <div class="mb-3">
              <label class="form-label">العنوان:</label>
              <input type="text" class="form-control" id="clientAddress" required>
            </div>
            <div class="mb-3">
              <label class="form-label">البريد الإلكتروني:</label>
              <input type="email" class="form-control" id="clientEmail">
            </div>
            <button type="submit" class="btn btn-primary w-100" id="btnSubmitOrder">إرسال الطلب</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxg6evWtAdWU4bAfYos23kMikQFg1la_IbD_nxkxQIktnppd7H8_xDIVk-yew-2S6Rk/exec";
    let modalInstance;

    document.addEventListener("DOMContentLoaded", () => {
      modalInstance = new bootstrap.Modal(document.getElementById('orderModal'));
      loadProducts();

      document.getElementById('orderQuantity').addEventListener('input', calculateTotal);
      document.getElementById('orderForm').addEventListener('submit', handleOrderSubmit);
    });

    function loadProducts() {
      fetch(`${SCRIPT_URL}?action=getProducts`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('loading').classList.add('d-none');
          const container = document.getElementById('products-container');
          container.innerHTML = '';

          if (data.success && data.products.length > 0) {
            data.products.forEach(p => {
              container.innerHTML += `
                <div class="col-md-4 col-sm-6">
                  <div class="card card-product shadow-sm h-100 p-3">
                    <span class="badge bg-secondary badge-stock">${p.unit || 'وحدة'}</span>
                    <div class="card-body d-flex flex-column justify-content-between">
                      <div>
                        <h5 class="card-title fw-bold text-dark">${p.itemName}</h5>
                        <p class="text-muted small mb-2">كود المنتج: ${p.itemCode}</p>
                        <p class="text-primary fw-bold fs-5 mb-3">${p.sellingPrice} ج.م</p>
                      </div>
                      <button class="btn btn-outline-primary w-100" onclick="openOrderModal('${p.itemCode}', '${p.itemName}', ${p.sellingPrice})">طلب الآن</button>
                    </div>
                  </div>
                </div>
              `;
            });
          } else {
            container.innerHTML = `<div class="col-12 text-center text-muted">لا توجد منتجات متاحة حالياً.</div>`;
          }
        })
        .catch(err => {
          document.getElementById('loading').innerHTML = `<p class="text-danger">حدث خطأ أثناء تحميل البيانات.</p>`;
        });
    }

    function openOrderModal(code, name, price) {
      document.getElementById('orderItemCode').value = code;
      document.getElementById('orderItemName').value = name;
      document.getElementById('displayItemName').value = name;
      document.getElementById('orderUnitPrice').value = price;
      document.getElementById('orderQuantity').value = 1;
      calculateTotal();
      modalInstance.show();
    }

    function calculateTotal() {
      const price = parseFloat(document.getElementById('orderUnitPrice').value) || 0;
      const qty = parseInt(document.getElementById('orderQuantity').value) || 1;
      document.getElementById('orderTotal').value = (price * qty).toFixed(2);
    }

    function handleOrderSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitOrder');
      btn.disabled = true;
      btn.innerText = "جاري الإرسال...";

      const payload = {
        action: "createOrder",
        itemCode: document.getElementById('orderItemCode').value,
        itemName: document.getElementById('orderItemName').value,
        quantity: document.getElementById('orderQuantity').value,
        totalAmount: document.getElementById('orderTotal').value,
        clientName: document.getElementById('clientName').value,
        phone: document.getElementById('clientPhone').value,
        address: document.getElementById('clientAddress').value,
        email: document.getElementById('clientEmail').value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerText = "إرسال الطلب";
        if (res.success) {
          alert("تم تسجيل طلبك بنجاح! سنتواصل معك قريباً.");
          modalInstance.hide();
          document.getElementById('orderForm').reset();
        } else {
          alert("حدث خطأ: " + res.message);
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerText = "إرسال الطلب";
        alert("حدث خطأ في الاتصال بالخادم.");
      });
    }
  </script>
</body>
</html>
