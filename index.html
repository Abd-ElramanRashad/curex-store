<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CureX Healthcare Solutions</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS CDN لقراءة ملفات الإكسيل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        .bg-curex-dark { background-color: #0F172A; }
        .bg-curex-teal { background-color: #0D9488; }
        .text-curex-teal { color: #0D9488; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- الهيدر / القائمة العلوي -->
    <header class="bg-curex-dark text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 bg-curex-teal rounded-lg flex items-center justify-center font-bold text-xl text-white">CX</div>
                <span class="font-bold text-xl tracking-wide">CureX <span class="text-teal-400 font-normal text-sm">Healthcare</span></span>
            </div>
            
            <nav class="hidden md:flex space-x-6 space-x-reverse font-medium">
                <a href="#products" class="hover:text-teal-400 transition">المنتجات</a>
                <a href="#about" class="hover:text-teal-400 transition">لماذا CureX؟</a>
                <a href="#contact" class="hover:text-teal-400 transition">تواصل معنا</a>
            </nav>

            <div class="flex items-center space-x-4 space-x-reverse">
                <a href="/admin.html" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                    لوحة التحكم
                </a>
                <div class="relative">
                    <button class="bg-slate-800 p-2 rounded-full hover:bg-slate-700 text-teal-400">
                        🛒 <span id="cart-count" class="bg-teal-500 text-xs text-white px-2 py-0.5 rounded-full">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- الهيرو / القسم الرئيسي -->
    <section class="bg-gradient-to-b from-slate-900 to-slate-800 text-white py-20 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <span class="bg-teal-900/60 text-teal-300 text-xs font-semibold px-3 py-1 rounded-full border border-teal-500/30">رعاية تبدأ من الاختيار الصحيح</span>
            <h1 class="text-4xl md:text-5xl font-extrabold mt-6 leading-tight">كل ما تحتاجه لرعاية أفضل.</h1>
            <p class="text-slate-300 mt-4 text-lg">مستلزمات صحية موثوقة جاهزة لعيادتك أو منزلك. اكتشفها بسهولة واطلبها بثقة.</p>
            <a href="#products" class="inline-block mt-8 bg-curex-teal hover:bg-teal-700 text-white font-bold px-8 py-3 rounded-lg shadow-lg transition">تصفح المنتجات ←</a>
        </div>
    </section>

    <!-- عرض المنتجات -->
    <section id="products" class="max-w-7xl mx-auto px-4 py-16">
        <h2 class="text-2xl font-bold text-slate-900 mb-8 border-r-4 border-teal-600 pr-3">قائمة المنتجات الطبية</h2>
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- يتم تحميل المنتجات هنا ديناميكياً من ملف الإكسيل -->
            <div class="col-span-full text-center py-12 text-slate-500">جاري تحميل المنتجات من قاعدة البيانات...</div>
        </div>
    </section>

    <script>
        // قراءة ملف الإكسيل عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            fetch('_CureX_Cloud_Database.xlsx')
                .then(res => res.arrayBuffer())
                .then(data => {
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const products = XLSX.utils.sheet_to_json(worksheet);

                    const grid = document.getElementById('products-grid');
                    if (products && products.length > 0) {
                        grid.innerHTML = products.map(item => `
                            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition">
                                <div class="p-5">
                                    <h3 class="font-bold text-lg text-slate-900 mb-2">${item.Name || item.اسم_المنتج || 'منتج طبي'}</h3>
                                    <p class="text-slate-500 text-sm mb-4">${item.Description || item.الوصف || 'مستلزمات طبية موثوقة'}</p>
                                    <div class="flex justify-between items-center">
                                        <span class="font-bold text-teal-700 text-xl">${item.Price || item.السعر || '0'} ج.م</span>
                                        <button class="bg-slate-900 hover:bg-teal-600 text-white px-3 py-1.5 rounded-lg text-sm transition">إضافة للسلة</button>
                                    </div>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">لم يتم العثور على منتجات داخل الملف.</div>`;
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('products-grid').innerHTML = `
                        <div class="col-span-full text-center py-12 text-slate-500">
                            سيتم ربط منتجات الإكسيل فوراً. أضف الأصناف في ملف <code class="bg-slate-200 px-2 py-1 rounded">_CureX_Cloud_Database.xlsx</code>
                        </div>`;
                });
        });
    </script>
</body>
</html>
