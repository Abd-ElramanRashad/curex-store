<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CureX - لوحة التحكم للإدارة</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --curex-green: #0c7a5c;
      --curex-green-hover: #096149;
      --curex-orange: #e07a5f;
      --curex-bg: #fdfbf7;
      --text-dark: #2c302e;
      --text-muted: #82807c;
      --footer-border: #eee8e0;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--curex-bg);
      color: var(--text-dark);
      margin: 0;
      padding: 0;
      direction: rtl;
      text-align: right !important;
    }

    *, ::after, ::before {
      text-align: right;
    }

    .top-bar {
      background-color: var(--curex-green);
      color: #ffffff;
      text-align: center !important;
      padding: 8px 15px;
      font-size: 0.88rem;
      font-weight: 700;
    }

    .navbar-curex {
      padding: 18px 0;
      background-color: transparent;
      border-bottom: 1px solid var(--footer-border);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-badge-icon {
      background-color: var(--curex-green);
      color: white;
      font-weight: 800;
      font-size: 1.25rem;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(12, 122, 92, 0.15);
    }

    .brand-name {
      color: var(--curex-green);
      font-weight: 800;
      font-size: 1.55rem;
      line-height: 1;
    }

    .brand-subtext {
      color: var(--curex-orange);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      margin-top: 3px;
    }

    .btn-curex-main {
      background-color: var(--curex-green);
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 10px 24px;
      border-radius: 10px;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-curex-main:hover {
      background-color: var(--curex-green-hover);
      color: white;
    }
