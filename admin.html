<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CureX - لوحة تحكم الأدمن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        curexBg: '#F7F4EE',
                        curexTeal: '#188B7E',
                        curexCoral: '#EE7252',
                        curexDarkText: '#2B3835'
                    }
                }
            }
        }
    </script>
    <style> body { font-family: 'Tajawal', sans-serif; background: #F7F4EE; color: #2B3835; } </style>
</head>
<body class="p-6">

    <!-- Admin Login -->
    <div id="login-screen" class="max-w-md mx-auto my-20 bg-[#FAF7F2] p-8 rounded-3xl shadow-xl border border-gray-200">
        <h2 class="text-2xl font-black text-center mb-6 text-curexTeal">دخول الأدمن 🔒</h2>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <input type="password" id="admin-pass" placeholder="كلمة المرور" class="w-full bg-white border border-gray-200 p-3 rounded-xl outline-none focus:border-curexTeal text-sm font-bold" required>
            <button type="submit" class="w-full bg-curexTeal text-white py-3 rounded-xl font-extrabold hover:bg-opacity-90 transition">تسجيل الدخول</button>
        </form>
    </div>

    <!-- Admin Dashboard -->
    <div id="dashboard-screen" class="hidden max-w-7xl mx-auto space-y-8">
        
        <div class="flex justify-between items-center bg-[#FAF7F2] p-6 rounded-3xl border border-gray-200">
            <h1 class="text-2xl font-black text-curexTeal">لوحة إدارة CureX</h1>
            <button onclick="location.reload()" class="bg-curexCoral text-white px-4 py-2 rounded-xl text-xs font-bold">خروج</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-[#FAF7F2] p-6 rounded-3xl border border-gray-200 border-r-4 border-r-curexTeal">
                <p class="text-gray-400 text-xs font-bold">إجمالي المبيعات</p>
                <h3 id="stat-sales" class="text-3xl font-black text-curexTeal mt-2">0 ج.م</h3>
            </div>
            <div class="bg-[#FAF7F2] p-6 rounded-3xl border border-gray-200 border-r-4 border-r-curexCoral">
                <p class="text-gray-400 text-xs font-bold">منتجات وصل حد الطلب</p>
                <h3 id="stat-alerts" class="text-3xl font-black text-curexCoral mt-2">0</h3>
            </div>
        </div>

    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById('admin-pass').value === '123456') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
            } else { alert('كلمة المرور غير صحيحة'); }
        }
    </script>
</body>
</html>
